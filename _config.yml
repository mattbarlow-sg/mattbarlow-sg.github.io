title: Matt Barlow
description: Projects, notes, and learnings from Matt Barlow.
url: https://mattbarlow-sg.github.io
baseurl: ""
timezone: America/New_York

permalink: /learnings/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      body_class: post-page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
